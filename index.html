<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tilawah Quest</title>
<link rel="stylesheet" href="css/fonts.css?v=60">
<link rel="stylesheet" href="css/app.css?v=60">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123B2A">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #113626;
  font-family: var(--font, sans-serif);
}
.splash-container {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 540px;
  margin: 0 auto;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  background-image: url('images/splash.jpg');
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px));
}
.tap-zone {
  width: 82%;
  max-width: 320px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 36px;
  background: rgba(255, 255, 255, 0.01);
  animation: pulse-button 1.4s infinite ease-in-out;
}
@keyframes pulse-button {
  0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 201, 60, 0)); }
  50% { transform: scale(1.05); filter: drop-shadow(0 6px 20px rgba(255, 201, 60, 0.7)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 201, 60, 0)); }
}
</style>
</head>
<body>
<div class="splash-container" id="splash-screen">
  <div class="tap-zone" aria-label="Tap to Start"></div>
</div>

<script src="js/app.js?v=60"></script>
<script>
(function () {
  var splash = document.getElementById('splash-screen');
  var started = false;

  function startGame() {
    if (started) return;
    started = true;
    try { TQ.sfx.tap(); } catch (e) {}

    setTimeout(function () {
      var kids = TQ.children();
      if (!kids.length) {
        location.href = 'login.html';
      } else if (kids.length === 1) {
        TQ.switchChild(kids[0].id);
      } else {
        location.href = 'pilih.html';
      }
    }, 180);
  }

  splash.addEventListener('click', startGame);
  splash.addEventListener('touchend', function (e) {
    e.preventDefault();
    startGame();
  });
})();
</script>
</body>
</html>
