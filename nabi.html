<!doctype html><html lang="id"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Susun Nama Nabi</title><style>body{font-family:Arial;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff3b0,#d7f7ff,#ffd9ed);color:#183b56}.app{max-width:900px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.card{background:#fff;border-radius:24px;padding:24px;margin-top:24px;box-shadow:0 8px 25px #183b5620}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer;background:#edf5f3;color:#183b56}.primary{background:#159dcc;color:#fff}.hero{height:180px;border-radius:18px;background:linear-gradient(135deg,#ffcf70,#6bc5d9);display:grid;place-items:center;font-size:80px}.pieces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0}.piece{background:#fff5cf;border:2px solid #efd78c;border-radius:14px;padding:14px 18px;font-size:20px;cursor:pointer}.answer{min-height:68px;border:2px dashed #bcd9df;border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.answer .piece{background:#e8f8f2}.used{opacity:.3;pointer-events:none}.info{text-align:center}.progress{color:#159dcc;font-weight:bold}@media(max-width:600px){.app{padding:14px}.card{padding:16px}.piece{font-size:18px;padding:12px 14px}}</style><main class="app"><header class="top"><h2>🌟 Susun Nama Nabi</h2><button class="btn" onclick="location.href='game-menu.html'">← Menu game</button></header><section class="card"><div class="hero" id="hero">🕌</div><div class="info"><h1 id="hint">Siapa nabi ini?</h1><p class="progress" id="progress"></p></div><div class="answer" id="answer">Susun nama di sini</div><div class="pieces" id="pieces"></div><button class="btn" id="reset">↻ Ulangi</button> <button class="btn primary" id="check">Periksa jawaban</button><p id="feedback"></p><section id="story" class="story" hidden></section></section></main><script>const info={Adam:['Wilayah sekitar Makkah','Diperkirakan hidup pada masa sangat awal manusia','Awal penciptaan manusia dan taubat setelah memakan buah terlarang.'],Idris:['Mesopotamia dan Mesir','Tidak diketahui secara pasti','Dikenal sebagai nabi yang tekun, jujur, dan memiliki ilmu.'],Nuh:['Irak kuno','Tidak diketahui secara pasti','Membangun bahtera dan menyelamatkan orang beriman dari banjir besar.'],Hud:['Ahqaf, Yaman','Tidak diketahui secara pasti','Berdakwah kepada kaum Ad dan memperingatkan mereka dari kesombongan.'],Saleh:['Al-Hijr, wilayah Arab Utara','Tidak diketahui secara pasti','Mukjizat unta betina untuk kaum Tsamud.'],Ibrahim:['Irak, Syam, dan Makkah','Tidak diketahui secara pasti','Menghancurkan berhala dan membangun Ka’bah bersama Ismail.'],Luth:['Sodom dan sekitarnya','Tidak diketahui secara pasti','Berdakwah kepada kaum yang melakukan kemaksiatan terbuka.'],Ismail:['Makkah','Tidak diketahui secara pasti','Kesabaran saat hendak dikorbankan dan membantu membangun Ka’bah.'],Ishaq:['Syam','Tidak diketahui secara pasti','Putra Ibrahim yang meneruskan dakwah tauhid.'],Yaqub:['Syam dan Mesir','Tidak diketahui secara pasti','Kesabaran menghadapi kehilangan Yusuf dan penyatuan kembali keluarga.'],Yusuf:['Mesir','Tidak diketahui secara pasti','Diuji dengan sumur, penjara, lalu menjadi pemimpin Mesir dan memaafkan saudara.'],Ayyub:['Syam','Tidak diketahui secara pasti','Kesabaran luar biasa menghadapi sakit dan kehilangan.'],Syuaib:['Madyan','Tidak diketahui secara pasti','Mengajarkan kejujuran dalam takaran dan timbangan.'],Musa:['Mesir dan Sinai','Tidak diketahui secara pasti','Membebaskan Bani Israil dari Fir’aun dan membelah laut dengan izin Allah.'],Harun:['Mesir dan Sinai','Tidak diketahui secara pasti','Mendampingi Musa berdakwah kepada Fir’aun dan Bani Israil.'],Dzulkifli:['Wilayah Irak atau Syam','Tidak diketahui secara pasti','Dikenal sabar dan menepati amanah.'],Dawud:['Baitul Maqdis','Tidak diketahui secara pasti','Mengalahkan Jalut dan dianugerahi kitab Zabur.'],Sulaiman:['Baitul Maqdis','Tidak diketahui secara pasti','Kerajaan besar, memahami bahasa hewan, dan kisah Ratu Balqis.'],Ilyas:['Syam','Tidak diketahui secara pasti','Mengajak kaumnya meninggalkan penyembahan Ba’l.'],Ilyasa:['Syam','Tidak diketahui secara pasti','Meneruskan dakwah tauhid setelah Ilyas.'],Yunus:['Ninawa, Irak','Tidak diketahui secara pasti','Berada dalam perut ikan dan berdoa dengan penuh taubat.'],Zakaria:['Baitul Maqdis','Tidak diketahui secara pasti','Berdoa memohon keturunan lalu mendapat kabar Yahya.'],Yahya:['Baitul Maqdis','Tidak diketahui secara pasti','Dikenal suci, zuhud, dan membenarkan risalah Isa.'],Isa:['Palestina','Sekitar abad pertama Masehi','Kelahiran tanpa ayah dan mukjizat dengan izin Allah.'],Muhammad:['Makkah dan Madinah','570 M – 632 M','Menerima wahyu Al-Qur’an dan menyempurnakan risalah para nabi.']};const data=[['Adam','🌿'],['Idris','📜'],['Nuh','🚢'],['Hud','🏜️'],['Saleh','🐪'],['Ibrahim','🔥'],['Luth','🏘️'],['Ismail','🕋'],['Ishaq','🌟'],['Yaqub','👨‍👦'],['Yusuf','🌾'],['Ayyub','💧'],['Syuaib','⚖️'],['Musa','🪄'],['Harun','🕌'],['Dzulkifli','📖'],['Dawud','🎵'],['Sulaiman','🦜'],['Ilyas','🌴'],['Ilyasa','🌿'],['Yunus','🐋'],['Zakaria','🕊️'],['Yahya','📜'],['Isa','✨'],['Muhammad','🕌']];let n=0,picked=[],$=x=>document.querySelector(x);function render(){let [name,icon]=data[n],parts=[...name].sort(()=>Math.random()-.5);$('#hero').textContent=icon;$('#progress').textContent=`Nabi ${n+1} dari 25`;$('#answer').innerHTML=picked.length?picked.map((x,i)=>`<button class="piece" data-r="${i}">${x}</button>`).join(''):'Susun nama di sini';$('#pieces').innerHTML=parts.map(x=>`<button class="piece ${picked.includes(x)?'used':''}" data-p="${x}">${x}</button>`).join('')}$('#pieces').onclick=e=>{let b=e.target.closest('[data-p]');if(b&&!picked.includes(b.dataset.p)){picked.push(b.dataset.p);render()}};$('#answer').onclick=e=>{let b=e.target.closest('[data-r]');if(b){picked.splice(+b.dataset.r,1);render()}};$('#reset').onclick=()=>{picked=[];render()};$('#check').onclick=()=>{if(picked.join('')===data[n][0]){let d=info[data[n][0]];$('#feedback').textContent=`Benar! ${data[n][0]} ✅`;$('#story').hidden=false;$('#story').innerHTML=`<h2>📚 Riwayat ${data[n][0]}</h2><p><b>Tempat tinggal:</b> ${d[0]}</p><p><b>Kelahiran dan wafat:</b> ${d[1]}</p><p><b>Kisah terkenal:</b> ${d[2]}</p><p>Nabi ${data[n][0]} mengajarkan keteguhan iman, kesabaran, dan ketaatan kepada Allah. Perjalanan dakwahnya menjadi pelajaran penting bagi umat manusia: tetap jujur ketika diuji, tidak sombong saat mendapat kelebihan, serta selalu kembali kepada Allah ketika melakukan kesalahan. Kisah ini dirangkum sebagai bahan belajar anak dan tidak menggantikan kajian dari sumber tafsir atau sejarah Islam yang terpercaya.</p>${n<24?'<button class="btn primary" id="nextNabi">Nabi berikutnya →</button>':''}`;$('#nextNabi')?.addEventListener('click',()=>{n++;picked=[];$('#story').hidden=true;render()})}else $('#feedback').textContent='Belum tepat, coba lagi';};render()</script><script src="enhance.js"></script></html>
