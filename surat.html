<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pilih Surat</title><style>body{margin:0;font-family:Arial;color:#17324d;background:linear-gradient(135deg,#bdeeff,#fff4bd,#ffcadc)}main{max-width:650px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.btn,input{border:0;border-radius:14px;padding:12px;font-weight:bold}input{width:100%;box-sizing:border-box;margin:18px 0}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.surah{padding:15px;border:0;border-radius:16px;background:#fff;text-align:left;font-weight:bold;cursor:pointer;box-shadow:0 3px 8px #17324d22}.surah:hover{background:#d8f7ff}.num{color:#159dcc;margin-right:8px}@media(max-width:430px){.list{grid-template-columns:1fr}}</style><main><header class="top"><h2>📖 Pilih Surat</h2><button class="btn" onclick="location.href='game-menu.html'">← Menu</button></header><p>Pilih surat untuk mulai menyusun ayat.</p><input id="q" placeholder="Cari nama surat..."><section id="list" class="list"></section></main><script>const names='Al-Fatihah|Al-Baqarah|Ali Imran|An-Nisa|Al-Maidah|Al-Anam|Al-Araf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Rad|Ibrahim|Al-Hijr|An-Nahl|Al-Isra|Al-Kahf|Maryam|Ta-Ha|Al-Anbiya|Al-Hajj|Al-Muminun|An-Nur|Al-Furqan|Asy-Syuara|An-Naml|Al-Qasas|Al-Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba|Fatir|Yasin|As-Saffat|Sad|Az-Zumar|Ghafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqiah|Al-Hadid|Al-Mujadilah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumuah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Maarij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba|An-Naziat|Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-Ala|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-Adiyat|Al-Qariah|At-Takasur|Al-Asr|Al-Humazah|Al-Fil|Quraisy|Al-Maun|Al-Kausar|Al-Kafirun|An-Nasr|Al-Lahab|Al-Ikhlas|Al-Falaq|An-Nas'.split('|');const list=document.querySelector('#list'),q=document.querySelector('#q');function render(){let f=q.value.toLowerCase();list.innerHTML=names.map((n,i)=>({n,i})).filter(x=>x.n.toLowerCase().includes(f)).map(x=>`<button class="surah" onclick="location.href='index-v2.html?surah=${x.i+1}'"><span class="num">${x.i+1}</span>${x.n}</button>`).join('')}q.oninput=render;render()</script></html>
