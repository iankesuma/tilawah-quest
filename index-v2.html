<!doctype html><html lang="id"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilawah Quest</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff4bd,#d9f7ff 48%,#ffd8e8);color:#183b56;margin:0;min-height:100vh}.app{max-width:1100px;margin:auto;padding:clamp(16px,4vw,34px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:bold;font-size:clamp(18px,4vw,25px);color:#159dcc}.pill{background:#fff;padding:12px 16px;border-radius:20px;box-shadow:0 5px 18px #183b5620}.welcome{text-align:center;margin:55px 0 30px}.welcome h1{font-size:58px;margin:10px}.layout{display:grid;grid-template-columns:1fr;gap:22px}.panel,.game{background:white;padding:24px;border-radius:26px;box-shadow:0 8px 25px #183b5620}.search{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;box-sizing:border-box}.surahs{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:500px;overflow:auto;margin-top:14px}.surah{border:0;padding:11px;border-radius:12px;text-align:left;background:#eff8fb;cursor:pointer}.surah:hover,.active{background:#c9effa!important}.arabic{font-family:serif;font-size:20px;float:right}.gamehead{display:flex;justify-content:space-between}.stars{color:#ffc857;font-size:24px}.bar{height:9px;background:#eee;border-radius:8px;margin:20px 0}.bar i{display:block;height:100%;background:#42b6d8;width:0}.workspace{min-height:180px;border:2px dashed #cde1e5;border-radius:16px;padding:16px;display:flex;gap:8px;flex-wrap:wrap;direction:rtl}.empty{width:100%;text-align:center;color:#9aa;padding:60px 0}.tile{font:24px serif;padding:10px 14px;border:2px solid #d8eadf;border-radius:12px;background:#f5fff8;cursor:pointer}.choices{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;margin:18px 0}.choices .tile{background:#fff7df;border-color:#f1d994;touch-action:none;user-select:none;cursor:grab}.choices .tile:active{cursor:grabbing;transform:scale(1.03)}.used{opa " id="reset">↻ Ulangi</button> <button class="btn primary" id="check">Periksa jawaban</button> <button class="btn next" id="nextSection" hidden>Lanjut section berikutnya →</button><span class="feedback" id="feedback">0 ayat tersusun</span><div class="achievements"><span class="achievement">🌱 Pemula</span><span class="achievement off" id="a2">⭐ Satu Surat</span><span class="achievement off" id="a3">🏆 Penjelajah 10</span></div></section></div></main><script>const names='Al-Fatihah|Al-Baqarah|Ali Imran|An-Nisa|Al-Maidah|Al-Anam|Al-Araf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Rad|Ibrahim|Al-Hijr|An-Nahl|Al-Isra|Al-Kahf|Maryam|Ta-Ha|Al-Anbiya|Al-Hajj|Al-Muminun|An-Nur|Al-Furqan|Asy-Syuara|An-Naml|Al-Qasas|Al-Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba|Fatir|Yasin|As-Saffat|Sad|Az-Zumar|Ghafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqiah|Al-Hadid|Al-Mujadilah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumuah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Maarij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba|An-Naziat|Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-Ala|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-Adiyat|Al-Qariah|At-Takasur|Al-Asr|Al-Humazah|Al-Fil|Quraisy|Al-Maun|Al-Kausar|Al-Kafirun|An-Nasr|Al-Lahab|Al-Ikhlas|Al-Falaq|An-Nas'.split('|');let id=+(new URLSearchParams(location.search).get('surah')||112),verses=['قُلْ هُوَ اللَّهُ أَحَدٌ','اللَّهُ الصَّمَدُ','لَمْ يَلِدْ وَلَمْ يُولَدْ','وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ'],picked=[],points=+localStorage.points||0,done=JSON.parse(localStorage.done||'[]'),$=x=>document.querySelector(x);$('#points').textContent=points;$('#done').textContent=done.length;let progress=JSON.parse(localStorage.getItem('tilawahProgress')||'{}'),section=0,sectionDone=[];function saveProgress(){progress[id]={section,sectionDone:[...sectionDone]};localStorage.setItem('tilawahProgress',JSON.stringify(progress))}function restoreProgress(){let p=progress[id]||{};sectionDone=Array.isArray(p.sectionDone)?p.sectionDone:[];section=Math.min(Number.isInteger(p.section)?p.section:0,Math.max(0,Math.ceil(verses.length/3)-1))}function splitVerse(v){let w=v.trim().split(/\s+/);if(w.length<3)return [v];let size=Math.ceil(w.length/5);return Array.from({length:5},(_,i)=>w.slice(Math.floor(i*w.length/5),Math.floor((i+1)*w.length/5)).join(' ')).filter(Boolean)}function render(){let start=section*3,end=Math.min(start+3,verses.length),part=verses.slice(start,end).flatMap(v=>verses.length>10?splitVerse(v):[v]),s=[...part].sort(()=>Math.random()-.5);$('#nextSection').hidden=true;$('#sections').innerHTML=Array.from({length:Math.ceil(verses.length/3)},(_,i)=>`<button class="section ${sectionDone[i]?'done':''} ${i===section?'active':''} ${i>section&&!sectionDone[i-1]?'locked':''}" data-section="${i}" ${i>section&&!sectionDone[i-1]?'disabled':''}>${i*3+1}–${Math.min(i*3+3,verses.length)}</button>`).join('');$('#workspace').innerHTML=picked.length?picked.map((x,i)=>`<button class="tile" data-r="${i}">${x}</button>`).join(''):'<div class="empty">Susun ayat di sini 🌟</div>';$('#choices').innerHTML=s.map(x=>`<button class="tile ${picked.includes(x)?'used':''}" data-p="${x}">${x}</button>`).join('');$('#feedback').textContent=picked.length+' dari '+part.length+' bagian tersusun';$('#progress').style.width=((section*5+picked.length)/verses.length*100)+'%'}function old_render_marker(){return null}function render_old_unused(){let start=section*3,end=Math.min(start+3,verses.length),part=verses.slice(start,end),s=[...part].sort(()=>Math.random()-.5);$('#sections').innerHTML=Array.from({length:Math.ceil(verses.length/3)},(_,i)=>`<button class="section ${sectionDone[i]?'done':''} ${i===section?'active':''} ${i>section&&!sectionDone[i-1]?'locked':''}" data-section="${i}" ${i>section&&!sectionDone[i-1]?'disabled':''}>${i*3+1}–${Math.min(i*3+3,verses.length)}</button>`).join('');$('#workspace').innerHTML=picked.length?picked.map((x,i)=>`<button class="tile" data-r="${i}">${x}</button>`).join(''):'<div class="empty">Susun ayat di sini 🌟</div>';$('#choices').innerHTML=s.map(x=>`<button class="tile ${picked.includes(x)?'used':''}" data-p="${x}">${x}</button>`).join('');$('#feedback').textContent=picked.length+' dari '+part.length+' ayat tersusun';$('#progress').style.width=((section*5+picked.length)/verses.length*100)+'%'}$('#sections').onclick=e=>{let b=e.target.closest('[data-section]');if(b&&!b.disabled){section=+b.dataset.section;picked=[];saveProgress();render()}};async function load(n){if(n===112)return;try{let r=await fetch('https://api.alquran.cloud/v1/surah/'+n+'/quran-uthmani');let d=await r.json();verses=d.data.ayahs.map(a=>a.text);if(n!==1)verses=verses.map(t=>{let w=t.trim().split(/\s+/);return w[0]==='بِسْمِ'&&w.length>4?w.slice(4).join(' '):t}).filter(Boolean);$('#meta').textContent='Surat '+n+' · '+verses.length+' ayat';picked=[];restoreProgress();render()}catch(e){$('#meta').textContent='Internet diperlukan untuk memuat ayat'}};function currentPart(){return verses.slice(section*3,section*3+3).flatMap(v=>verses.length>10?splitVerse(v):[v])}function acceptChoice(x){let part=currentPart();if(x!==part[picked.length]){beep(false);$('#feedback').textContent='Urutan belum benar. Coba potongan berikutnya.';return false}return true}let dragText=null,dragging=false;$('#choices').onpointerdown=e=>{let b=e.target.closest('[data-p]');if(!b||b.classList.contains('used'))return;dragText=b.dataset.p;dragging=true;b.setPointerCapture?.(e.pointerId);e.preventDefault()};document.onpointerup=e=>{if(!dragging)return;let target=document.elementFromPoint(e.clientX,e.clientY);let inWorkspace=target?.closest('#workspace');if(inWorkspace&&dragText&&!picked.includes(dragText)&&acceptChoice(dragText)){picked.push(dragText);render()}dragText=null;dragging=false};$('#choices').onclick=e=>{if(dragging)return;let b=e.target.closest('[data-p]');if(b&&!picked.includes(b.dataset.p)&&acceptChoice(b.dataset.p)){picked.push(b.dataset.p);render()}};$('#choices').onpointercancel=()=>{dragText=null;dragging=false};$('#choices').ondragstart=e=>e.preventDefault();$('#choices').setAttribute('aria-label','Seret potongan ayat ke kotak jawaban');$('#workspace').setAttribute('aria-label','Kotak jawaban, lepaskan potongan ayat di sini');$('#workspace').onclick=e=>{let b=e.target.closest('[data-r]');if(b){picked.splice(+b.dataset.r,1);render()}};$('#reset').onclick=()=>{picked=[];render()};function beep(ok){let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.type=ok?'sine':'square';o.frequency.value=ok?880:160;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.45)}$('#check').onclick=()=>{let start=section*3,part=verses.slice(start,start+3).flatMap(v=>verses.length>10?splitVerse(v):[v]);if(picked.length<part.length){beep(false);return $('#feedback').textContent='Susun semua ayat dulu';}if(picked.every((x,i)=>x===part[i])){beep(true);sectionDone[section]=true;saveProgress();if(typeof popup==='function')popup('🎉 Alhamdulillah sudah hapal! Masya Allah!',true);$('#workspace').animate([{transform:'scale(1)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:500});$('#nextSection').hidden=section>=Math.ceil(verses.length/3)-1;$('#feedback').textContent='Benar! Alhamdulillah 🎉';$('#feedback').className='feedback good';$('#stars').textContent='★★★';points+=verses.length*10;$('#points').textContent=points;localStorage.points=points;if(!done.includes(id)){done.push(id);localStorage.done=JSON.stringify(done);$('#done').textContent=done.length}$('#a2').classList.remove('off');if(done.length>=10)$('#a3').classList.remove('off')}else{$('#feedback').textContent='Belum tepat, coba lagi';$('#stars').textContent='★☆☆'}};$('#nextSection').onclick=()=>{if(section<Math.ceil(verses.length/3)-1){section++;picked=[];saveProgress();$('#nextSection').hidden=true;$('#feedback').className='feedback';render()}};restoreProgress();if(id!==112)load(id);render()</script></body><script src="enhance.js"></script></html>
