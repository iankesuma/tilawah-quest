<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tebak Ayat — Tilawah Quest</title>
<link rel="stylesheet" href="css/app.css?v=53">
<link rel="stylesheet" href="css/screens.css?v=53">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DDF1FA">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
.ta-card{display:grid;gap:12px}
.ta-ar{font-family:var(--font-ar);font-size:25px;line-height:2.1;text-align:right;direction:rtl;color:#16394B;background:#F5FBFE;border-radius:16px;padding:14px 16px;min-height:104px;display:flex;align-items:center;justify-content:flex-end}
.ta-q{font-size:12.5px;font-weight:900;color:#7C97A5;text-align:center;letter-spacing:.2px}
.ta-opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;background:#fff;border:2px solid #DCEBF4;border-radius:15px;padding:13px 14px;font-family:inherit;font-size:14.5px;font-weight:800;color:var(--ink);cursor:pointer;transition:.12s}
.opt:active{transform:scale(.99)}
.opt.right{background:#E6F4EA;border-color:var(--green);color:var(--green-d)}
.opt.wrong{background:#FDE8ED;border-color:#E2564E;color:#B23A55;opacity:.75}
.opt[disabled]{cursor:default}
.ta-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ta-stage{font-size:11.5px;font-weight:900;color:#4F7080;background:#F1F8FC;border-radius:10px;padding:5px 9px}
.ta-hearts{display:flex;gap:3px;font-size:14px;color:#F06A8A}
.ta-hearts span{color:#F06A8A}
.ta-hearts .off{color:#D7E4EC}
.ta-done{background:#F5FBFE;border-radius:16px;padding:14px;display:grid;gap:10px;text-align:center}
.ta-done h3{margin:0;font-family:var(--font-display);font-size:19px;color:var(--green-d)}
.ta-done .stars{font-size:26px;color:var(--yellow);letter-spacing:2px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:10px}
.jb{background:#fff;border:2px solid #DCEBF4;border-radius:15px;padding:10px 8px;display:grid;gap:3px;text-align:center;font-family:inherit;cursor:pointer}
.jb b{font-family:var(--font-display);font-size:16px;color:var(--ink)}
.jb small{font-size:10.5px;font-weight:800;color:#7C97A5}
.jb.done{background:#F4FBEA;border-color:#BFE09A}
.jb.done small{color:var(--green-d)}
.hgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;padding:4px 0 12px}
.hn{border:0;border-radius:11px;background:#F1F8FC;color:#4F7080;font-family:inherit;font-size:12.5px;font-weight:900;padding:9px 0;cursor:pointer;position:relative}
.hn.done{background:#E6F4EA;color:var(--green-d)}
.hn.now{background:var(--green);color:#fff}
.hcount{font-size:11.5px;font-weight:800;color:#7C97A5;margin:0 0 6px}
.sheet-act{display:flex;gap:8px;margin:6px 0 4px}
.sheet-act .btn{flex:1}
</style>
</head>
<body>
<main class="screen">
  <div class="appbar">
    <button class="iconbtn" id="back" aria-label="Kembali">←</button>
    <div class="titles"><b>Tebak Ayat</b><span id="prog">Pilih juz</span></div>
    <span class="chip"><span class="star">⭐</span> <b id="pts">0</b></span>
    <button class="iconbtn hidden" id="openlist" aria-label="Pilih stage">☰</button>
  </div>

  <div class="bar hidden" id="barwrap" style="margin-bottom:10px"><i id="pbar" style="width:0%"></i></div>

  <section class="card hidden" id="picker">
    <p class="muted center" style="font-weight:800;font-size:12.5px">Mau tebak ayat dari juz berapa?</p>
    <div class="jgrid" id="jgrid"></div>
  </section>

  <section class="card ta-card hidden" id="game">
    <div class="ta-top">
      <span class="ta-stage" id="stage-badge">Juz 1 · Stage 1</span>
      <div class="ta-hearts" id="hearts" aria-label="Nyawa"></div>
    </div>
    <p class="ta-q">Ayat ini dari surah mana?</p>
    <div class="ta-ar" id="ar">…</div>
    <div class="ta-opts" id="opts"></div>
    <div class="ta-done hidden" id="done"></div>
  </section>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-inner">
    <div class="sheet-head">
      <input class="input" id="hq" type="search" placeholder="Cari stage…" autocomplete="off">
      <button class="iconbtn" id="sheet-close" aria-label="Tutup">✕</button>
    </div>
    <p class="hcount" id="hcount"></p>
    <div class="hgrid" id="hgrid"></div>
    <div class="sheet-act"><button class="btn ghost small" id="change-juz">Ganti juz</button></div>
  </div>
</div>

<script src="js/app.js?v=53"></script>
<script src="js/tebak.js?v=33"></script>
</body>
</html>
