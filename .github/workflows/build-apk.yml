name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Sync Web to Android
        run: |
          node sync_www.js
          npx cap sync android || true

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug > build_output.log 2>&1 || true
          cat build_output.log | tail -n 60 > summary.txt
          cat summary.txt

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-Error-Summary
          path: android/summary.txt
          retention-days: 7
