name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Sync Web to Android
        run: |
          node sync_www.js
          npx cap sync android || true

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/*.apk ../dist-apk/
          ls -lh ../dist-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TilawahQuest-v1.0-APK
          path: dist-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.6-apk
          name: "Tilawah Quest v1.0.6 APK (Clean Native Build)"
          body: "Rilis bersih APK Android resmi Tilawah Quest. 100% Offline asset loading native, Susun Ayat 30 Juz, Tebak Ayat, Kuis Tajwid, Muroja'ah Cepat, dan 31 Piagam Penghargaan."
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
