name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Sync Web Assets to Android
        run: |
          node sync_www.js
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/
          ls -la android/app/src/main/assets/public/index.html

      - name: Decode Release Keystore
        env:
          TQ_KEYSTORE_B64: ${{ secrets.TQ_KEYSTORE_B64 }}
        run: |
          if [ -z "$TQ_KEYSTORE_B64" ]; then echo "TQ_KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$TQ_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tilawah-release.p12"
          ls -l "$RUNNER_TEMP/tilawah-release.p12"

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      - name: Build Debug and Release APK
        env:
          TQ_KEYSTORE: ${{ runner.temp }}/tilawah-release.p12
          TQ_KEYSTORE_PASSWORD: ${{ secrets.TQ_KEYSTORE_PASSWORD }}
          TQ_KEY_ALIAS: ${{ secrets.TQ_KEY_ALIAS }}
          TQ_KEY_PASSWORD: ${{ secrets.TQ_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/debug/*.apk ../dist-apk/TilawahQuest-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist-apk/TilawahQuest-release.apk
          ls -lh ../dist-apk/

      - name: Verify Release Signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist-apk/TilawahQuest-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TilawahQuest-v1.0.16-APK
          path: dist-apk/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.17-apk
          name: "Tilawah Quest v1.0.17 APK (audit fixes)"
          body: "Perbaikan audit: piagam canvas, audio qari berhenti saat stage selesai/back, reset menghapus semua progres anak. Backup/restore dan release signed tetap ada."
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
