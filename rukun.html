<!doctype html><html lang="id"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Susun Rukun</title><style>body{font-family:Arial;margin:0;min-height:100vh;background:linear-gradient(135deg,#fff1a8,#d4f7ff,#ffd4e5);color:#183b56}.app{max-width:800px;margin:auto;padding:20px}.card{background:#fff;padding:24px;border-radius:24px;box-shadow:0 8px 24px #183b5620;margin-top:20px}.top{display:flex;justify-content:space-between;align-items:center}.btn,.item{border:0;border-radius:12px;padding:13px 16px;font-weight:bold;cursor:pointer}.btn{background:#edf5f3;color:#183b56}.primary{background:#159dcc;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab.active{background:#159dcc;color:#fff}.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0}.item{background:#fff1bf;border:2px solid #efd789;font-size:18px}.answer{min-height:70px;border:2px dashed #b8d5dc;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.answer .item{background:#e1f7ef}.used{opacity:.3;pointer-events:none}.desc{line-height:1.65;background:#f3fbfa;padding:16px;border-radius:14px;margin-top:18px}@media(max-width:600px){.card{padding:15px}.item{font-size:16px;padding:12px}}</style><main class="app"><header class="top"><h2>🌟 Susun Rukun</h2><button class="btn" onclick="location.href='game-menu.html'">← Menu</button></header><section class="card"><div class="tabs"><button class="btn tab active" data-kind="iman">Rukun Iman</button><button class="btn tab" data-kind="islam">Rukun Islam</button></div><h1 id="title"></h1><p id="round"></p><div class="answer" id="answer">Susun urutan di sini</div><div class="items" id="items"></div><button class="btn" id="reset">↻ Ulangi</button> <button class="btn primary" id="check">Periksa</button><p id="feedback"></p><div class="desc" id="desc"></div></section></main><script>const sets={iman:{title:'Susun 6 Rukun Iman',items:['Iman kepada Allah','Iman kepada malaikat','Iman kepada kitab-kitab Allah','Iman kepada rasul-rasul Allah','Iman kepada hari akhir','Iman kepada qada dan qadar'],desc:'Rukun iman adalah enam dasar keyakinan seorang Muslim. Anak-anak belajar mengenal Allah, malaikat, kitab, rasul, hari akhir, serta qada dan qadar dengan penuh iman dan sikap baik.'},islam:{title:'Susun 5 Rukun Islam',items:['Membaca syahadat','Mendirikan salat','Membayar zakat','Berpuasa Ramadan','Menunaikan haji bagi yang mampu'],desc:'Rukun Islam adalah lima amalan utama. Syahadat menjadi kesaksian iman, salat menjaga hubungan dengan Allah, zakat membantu sesama, puasa melatih takwa, dan haji dilakukan bagi yang mampu.'}};let kind='iman',picked=[],$=x=>document.querySelector(x);function render(){let s=sets[kind];$('#title').textContent=s.title;$('#desc').textContent=s.desc;$('#round').textContent=`${s.items.length} urutan`;let shuffled=[...s.items].sort(()=>Math.random()-.5);$('#answer').innerHTML=picked.length?picked.map((x,i)=>`<button class="item" data-r="${i}">${x}</button>`).join(''):'Susun urutan di sini';$('#items').innerHTML=shuffled.map(x=>`<button class="item ${picked.includes(x)?'used':''}" data-p="${x}">${x}</button>`).join('')}function beep(ok){let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.type=ok?'sine':'square';o.frequency.value=ok?880:180;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.22,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(ok?.35:.5));o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.35:.5))}$('#items').onclick=e=>{let b=e.target.closest('[data-p]');if(!b||picked.includes(b.dataset.p))return;let expected=sets[kind].items[picked.length];if(b.dataset.p!==expected){beep(false);$('#feedback').textContent='Tetot! Urutan belum benar. Pilih rukun berikutnya.';return}beep(true);picked.push(b.dataset.p);$('#feedback').textContent='Benar!';render()};$('#answer').onclick=e=>{let b=e.target.closest('[data-r]');if(b){picked.splice(+b.dataset.r,1);render()}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;picked=[];document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('#reset').onclick=()=>{picked=[];render()};$('#check').onclick=()=>{$('#feedback').textContent=picked.join('|')===sets[kind].items.join('|')?'Benar! Hebat ✅':'Belum tepat, coba susun lagi'};render()</script><script src="enhance.js"></script></html>
