<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan — Tilawah Quest</title>
<link rel="stylesheet" href="css/app.css?v=60">
<link rel="stylesheet" href="css/screens.css?v=60">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DDF1FA">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/fonts.css?v=60">
</head>
<body>
<main class="screen">
  <div class="gamebar">
    <a class="iconbtn" href="surah.html?juz=30" id="quit" aria-label="Keluar">✕</a>
    <div class="gtitle">
      <b id="g-title">An-Naba</b>
      <i id="g-ar">النبأ</i>
    </div>
    <div class="row" style="gap:6px">
      <button class="iconbtn" id="speak" aria-label="Putar bacaan">🔊</button>
      <span class="score">⭐ <b id="score">0</b></span>
    </div>
  </div>

  <div class="row between" style="margin-bottom:4px">
    <div class="hearts" id="hearts" aria-label="Nyawa"></div>
    <span class="muted" id="step">Ayat 1</span>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <section class="ayat-card">
    <div class="ac-title">
      <span id="surah-label">سورة النبأ</span>
      <span id="mode-label">Susun Ayat</span>
    </div>
    <div class="bismillah" id="bismillah">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <div id="ayat-lines" class="clue"></div>

    <div class="answer-area" id="slots" aria-live="polite">
      <span class="ph">Ketuk kata di bawah</span>
    </div>
    <div class="ac-foot"><span id="ayah-no">Ayat 1</span><span id="slot-count"></span></div>
  </section>

  <p class="instr" id="instr">Ketuk atau tahan &amp; geser kata ke kotak <span aria-hidden="true">👇</span> <span id="hint-word" class="hint-word"></span></p>
  <div class="bank" id="bank"></div>

  <div class="play-actions">
    <span class="chip" id="combo" hidden>🔥 Combo <b>0</b></span>
    <div style="display:flex;gap:6px;margin-left:auto">
      <button class="btn ghost small" id="mic-btn" style="display:none" title="Ucapkan kata arab">🎤 Suara</button>
      <button class="btn ghost small" id="retry-ayah">↻ Ulangi ayat</button>
    </div>
  </div>

  <div class="play-mascot" id="mascot"></div>
</main>

<script src="js/app.js?v=60"></script>
<script src="js/quran.js?v=60"></script>
<script src="js/play.js?v=60"></script>
</body>
</html>
