<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Tilawah Quest</title><style>*{box-sizing:border-box}.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#60798a;margin-top:10px}.remember input{width:17px;height:17px;accent-color:#159dcc}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff1a8,#bdefff 52%,#ffc9df);color:#183b56;display:grid;place-items:center;padding:20px}.shell{width:min(100%,980px);min-height:620px;border-radius:32px;overflow:hidden;background:#fff;box-shadow:0 20px 60px #183b5633;display:grid;grid-template-columns:1.1fr .9fr}.art{position:relative;background:#53bde0 url('dashboard_20261124_143537_aeec6e77_Tilawah_Quest__Quran_Learning_Adventure_a8b0ac.png') center/cover no-repeat;display:flex;align-items:flex-end;padding:38px;color:#fff}.art:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,#123e70cc)}.art h1{position:relative;z-index:1;font-size:clamp(38px,5vw,68px);line-height:.95;margin:0;letter-spacing:-.06em;text-shadow:0 3px 12px #123e70}.login{padding:clamp(28px,5vw,62px);display:flex;flex-direction:column;justify-content:center}.logo{color:#159dcc;font-weight:900;font-size:22px;margin-bottom:42px}.logo span{background:#159dcc;color:white;border-radius:13px 13px 13px 3px;padding:8px 10px;margin-right:9px}.eyebrow{color:#ef7d9a;font-weight:bold;font-size:12px;letter-spacing:.12em}.login h2{font-size:38px;margin:10px 0}.sub{color:#71818e;margin:0 0 28px;line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input{width:100%;border:2px solid #e6eef0;border-radius:13px;padding:14px;font-size:16px;outline:none}.field input:focus{border-color:#38acd0}.submit{border:0;border-radius:14px;padding:15px;background:#159dcc;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px;box-shadow:0 7px 15px #159dcc55}.submit:hover{background:#087ea8}.error{color:#d45162;min-height:20px;font-size:13px;margin-top:12px}.hint{margin-top:35px;color:#9aa7ad;font-size:12px;text-align:center}.hint b{color:#159dcc}@media(max-width:700px){.shell{display:block;min-height:0}.art{min-height:230px;padding:25px}.art h1{font-size:44px}.login{padding:30px 24px}.logo{margin-bottom:28px}}
</style></head><body><main class="shell"><section class="art"></section><section class="login"><div class="eyebrow">PETUALANGAN HAFALAN</div><h2>Selamat datang 👋</h2><p class="sub">Masuk untuk melanjutkan perjalanan hafalan Quran.</p><form id="form"><div class="field"><label for="id">ID pengguna</label><input id="id" autocomplete="username" required placeholder="Masukkan ID"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></div><label class="remember"><input id="remember" type="checkbox"> Ingat login di perangkat ini</label><button class="submit">Masuk ke game ✨</button><div class="error" id="error"></div></form><div class="hint">Akun awal: <b>admin</b> / <b>admin</b></div></section></main><script>const DB_KEY='tilawahUsers';if(!localStorage.getItem(DB_KEY))localStorage.setItem(DB_KEY,JSON.stringify([{id:'admin',password:'admin',role:'admin'}]));let remembered=JSON.parse(localStorage.getItem('tilawahRemember')||'null');if(remembered){document.querySelector('#id').value=remembered.id;document.querySelector('#password').value=remembered.password;document.querySelector('#remember').checked=true}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let users=JSON.parse(localStorage.getItem(DB_KEY)||'[]'),id=document.querySelector('#id').value.trim(),password=document.querySelector('#password').value,found=users.find(u=>u.id===id&&u.password===password);if(!found){document.querySelector('#error').textContent='ID atau password salah. Coba lagi.';return}if(document.querySelector('#remember').checked)localStorage.setItem('tilawahRemember',JSON.stringify({id, password}));else localStorage.removeItem('tilawahRemember');sessionStorage.setItem('tilawahUser',JSON.stringify({id:found.id,role:found.role}));location.href='game-menu.html'};</script><script src="enhance.js"></script></body></html>
