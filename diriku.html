<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diriku — Tilawah Quest</title>
<style>
:root{--ink:#17324d;--sky:#bdeeff;--pink:#ffb8d2;--gold:#ffd45c;--green:#63d39a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--sky),#fff7c7 52%,var(--pink));min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:800}.coins{background:#fff;border:3px solid var(--gold);border-radius:22px;padding:10px 16px;font-size:18px;font-weight:800}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:700;color:var(--ink);background:#fff;cursor:pointer}.hero{text-align:center;margin:30px 0 20px}.hero h1{font-size:clamp(40px,7vw,76px);margin:5px}.hero p{font-size:18px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#ffffffdb;border:3px solid #fff;border-radius:28px;padding:22px;box-shadow:0 10px 25px #17324d22}.stage{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#e7fbff,#fff0c9)}.avatar{font-size:105px;line-height:1;margin:14px}.vehicle{font-size:75px;height:90px}.look{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tag{background:#fff;border-radius:18px;padding:8px 12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab.active{background:#17324d;color:#fff}.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#fff;border:2px solid #dcecf2;border-radius:18px;padding:13px;text-align:center}.item .pic{font-size:40px}.item h3{margin:7px 0 4px;font-size:16px}.price{color:#b47700;font-weight:800;margin:6px}.buy{background:var(--green);width:100%}.buy.owned{background:#dceff0}.buy:disabled{opacity:.6;cursor:not-allowed}.gender{display:flex;gap:8px}.note{font-size:13px;color:#547085}@media(max-width:720px){.layout{grid-template-columns:1fr}.stage{min-height:330px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🌟 Tilawah Quest</div><div><button class="btn" onclick="location.href='game-menu.html'">← Menu game</button> <span class="coins">🪙 <b id="points">0</b> poin</span></div></header><section class="hero"><div>MINI GAME KREATIF</div><h1>Diriku</h1><p>Buat karakter impianmu. Kumpulkan poin dari belajar, lalu belanja di toko.</p></section><div class="layout"><section class="card stage"><h2 id="name">Diriku</h2><div class="avatar" id="avatar">👧</div><div class="vehicle" id="vehicle">🛴</div><div class="look"><span class="tag" id="clothes">👕 Baju santai</span><span class="tag" id="accessory">🎒 Tanpa aksesori</span></div></section><section class="card"><h2>✨ Atur karakter</h2><div class="gender"><button class="btn tab active" data-gender="girl">👧 Anak perempuan</button><button class="btn tab" data-gender="boy">👦 Anak laki-laki</button></div><div class="tabs"><button class="btn tab active" data-cat="clothes">👕 Baju</button><button class="btn tab" data-cat="accessory">🧢 Aksesori</button><button class="btn tab" data-cat="vehicle">🛴 Kendaraan</button></div><p class="note">Barang terkunci dibeli memakai poin.</p><div class="shop" id="shop"></div></section></div></main>
<script>
const data={clothes:[['Baju santai','👕',0],['Baju kuning','🟡',30],['Jaket keren','🧥',60],['Baju olahraga','🥋',80]],accessory:[['Tanpa aksesori','🎒',0],['Topi','🧢',25],['Kacamata','🕶️',40],['Mahkota','👑',100]],vehicle:[['Skuter','🛴',0],['Sepeda','🚲',50],['Mobil kecil','🚙',120],['Roket','🚀',250]]};
let points=Number(localStorage.getItem('points')||0), profile=JSON.parse(localStorage.getItem('dirikuProfile')||'{"gender":"girl","clothes":0,"accessory":0,"vehicle":0}'),cat='clothes';
const $=s=>document.querySelector(s);function save(){localStorage.setItem('points',points);localStorage.setItem('dirikuProfile',JSON.stringify(profile));$('#points').textContent=points}function render(){let list=data[cat];$('#shop').innerHTML=list.map((x,i)=>{let owned=profile[cat]===i||x[2]===0,can=owned||points>=x[2];return `<div class="item"><div class="pic">${x[1]}</div><h3>${x[0]}</h3><div class="price">${x[2]?'🪙 '+x[2]:'Gratis'}</div><button class="btn buy ${owned?'owned':''}" data-i="${i}" ${can?'':'disabled'}>${profile[cat]===i?'Dipakai':owned?'Pakai':'Beli'}</button></div>`}).join('');let g=profile.gender==='girl';$('#avatar').textContent=g?'👧':'👦';$('#clothes').textContent=data.clothes[profile.clothes][1]+' '+data.clothes[profile.clothes][0];$('#accessory').textContent=data.accessory[profile.accessory][1]+' '+data.accessory[profile.accessory][0];$('#vehicle').textContent=data.vehicle[profile.vehicle][1];$('#points').textContent=points}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{profile.gender=b.dataset.gender;document.querySelectorAll('[data-gender]').forEach(x=>x.classList.toggle('active',x===b));save();render()});$('#shop').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let i=+b.dataset.i,x=data[cat][i];if(profile[cat]!==i&&x[2]>0){if(points<x[2])return;points-=x[2]}profile[cat]=i;save();render()};save();render();
</script></body></html>
