<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diriku — Tilawah Quest</title>
<style>
:root{--ink:#17324d;--sky:#bdeeff;--pink:#ffb8d2;--gold:#ffd45c;--green:#63d39a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--sky),#fff7c7 52%,var(--pink));min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:800}.coins{background:#fff;border:3px solid var(--gold);border-radius:22px;padding:10px 16px;font-size:18px;font-weight:800}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:700;color:var(--ink);background:#fff;cursor:pointer}.hero{text-align:center;margin:30px 0 20px}.hero h1{font-size:clamp(40px,7vw,76px);margin:5px}.hero p{font-size:18px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#ffffffdb;border:3px solid #fff;border-radius:28px;padding:22px;box-shadow:0 10px 25px #17324d22}.stage{min-height:550px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#e7fbff,#fff0c9)}.person{position:relative;width:230px;height:355px}.head{position:absolute;top:10px;left:76px;width:78px;height:78px;border-radius:50%;background:#d8966c;border:4px solid #7c4b3d;z-index:5}.person.boy .head{left:76px}.person.boy .hair{width:82px;height:30px;top:-5px;border-radius:45% 45% 20% 20%}.person.girl .hair{width:96px;height:62px;left:-9px;top:-12px;border-radius:50% 50% 35% 35%}.hijab{display:none;position:absolute;z-index:1;top:-15px;left:-12px;width:102px;height:105px;background:transparent;border:7px solid #e98ab8;border-radius:52% 52% 42% 42%;pointer-events:none}.person.girl .hijab{display:block}.person.girl .hair{display:none}.person.boy .body{border-radius:18px 18px 10px 10px}.person.boy .shoe{background:#315b9d}.person.girl .shoe{background:#e65d73}.hair{position:absolute;top:-8px;left:-5px;width:88px;height:40px;border-radius:50%;background:#35241f}.eye{position:absolute;top:39px;width:9px;height:9px;background:#17324d;border-radius:50%}.e1{left:22px}.e2{right:22px}.smile{position:absolute;left:30px;top:54px;width:19px;height:10px;border-bottom:3px solid #8b3f46;border-radius:50%}.body{position:absolute;top:87px;left:49px;width:130px;height:145px;border-radius:38px 38px 16px 16px;background:#d8966c;border:4px solid #386a80}.shirt-layer{position:absolute;z-index:3;top:87px;left:49px;width:130px;height:145px;border-radius:38px 38px 16px 16px;background:var(--shirt,#54bfe3);border:4px solid #386a80}.pants-layer{position:absolute;z-index:3;top:0;left:0;width:48px;height:105px;background:var(--pants,#5278bd);border:4px solid #385174;border-radius:10px}.pants-layer+ .leg{background:#d8966c}.pants-layer~.leg{background:#d8966c}.leg{position:relative;z-index:2} .legs .leg:not(:first-child){background:#d8966c} .legs{z-index:2} .pants-layer{transform:translateX(0)} .arm{position:absolute;top:105px;width:35px;height:125px;border-radius:22px;background:#d8966c;border:4px solid #7c4b3d;z-index:1}.a1{left:20px}.a2{right:20px}.legs{position:absolute;top:218px;left:62px;display:flex;gap:12px}.leg{width:48px;height:105px;background:var(--pants,#5278bd);border:4px solid #385174;border-radius:10px}.shoe{position:absolute;top:310px;width:72px;height:28px;border-radius:20px;background:#e65d73;border:4px solid #783c50}.s1{left:47px}.s2{right:47px}.ride{font-size:72px;height:80px}.toy{font-size:48px;position:absolute;right:0;bottom:55px}.vehicle{font-size:75px;height:90px}.look{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.tag{background:#fff;border-radius:18px;padding:8px 12px;font-weight:700}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab.active{background:#17324d;color:#fff}.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{background:#fff;border:2px solid #dcecf2;border-radius:18px;padding:13px;text-align:center}.item .pic{font-size:40px}.item h3{margin:7px 0 4px;font-size:16px}.price{color:#b47700;font-weight:800;margin:6px}.buy{background:var(--green);width:100%}.buy.owned{background:#dceff0}.buy:disabled{opacity:.6;cursor:not-allowed}.gender{display:flex;gap:8px}.note{font-size:13px;color:#547085}@media(max-width:720px){.layout{grid-template-columns:1fr}.stage{min-height:330px}}.head{z-index:8}.eye,.smile{z-index:9}.legs{z-index:2}.legs .leg{visibility:visible!important;display:block!important;position:relative;z-index:2;background:#d8966c}.pants-layer{top:0;left:-6px;width:114px;height:58px;z-index:4;border-radius:16px;background:var(--pants,#5278bd)}.shoe{z-index:6}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🌟 Tilawah Quest</div><div><button class="btn" onclick="location.href='game-menu.html'">← Menu game</button> <span class="coins">🪙 <b id="points">0</b> poin</span></div></header><section class="hero"><div>MINI GAME KREATIF</div><h1>Diriku</h1><p>Buat karakter impianmu. Kumpulkan poin dari belajar, lalu belanja di toko.</p></section><div class="layout"><section class="card stage"><h2>Karakterku</h2><div class="person"><div class="head"><i class="hair"></i><i class="hijab"></i><i class="eye e1"></i><i class="eye e2"></i><i class="smile"></i></div><div class="arm a1"></div><div class="arm a2"></div><div class="body"></div><div class="shirt-layer" id="shirtLayer"></div><div class="legs"><div class="leg"></div><div class="leg"></div><div class="pants-layer" id="pantsLayer"></div></div><div class="shoe s1"></div><div class="shoe s2"></div><div class="toy" id="toy"></div></div><div class="ride" id="ride">🛴</div><div class="look"><span class="tag" id="shirtTag"></span><span class="tag" id="pantsTag"></span><span class="tag" id="toyTag"></span></div></section><section class="card"><h2>✨ Atur karakter</h2><div class="gender"><button class="btn tab active" data-gender="girl">👧 Anak perempuan</button><button class="btn tab" data-gender="boy">👦 Anak laki-laki</button></div><div class="tabs"><button class="btn tab active" data-cat="shirt">👕 Baju</button><button class="btn tab" data-cat="pants">👖 Celana</button><button class="btn tab" data-cat="ride">🛴 Kendaraan</button><button class="btn tab" data-cat="toy">⚽ Benda</button></div><p class="note">Barang terkunci dibeli memakai poin.</p><div class="shop" id="shop"></div></section></div></main>
<script>
const data={shirt:[['Baju biru','🔵','#54bfe3',0],['Baju merah','🔴','#ed6674',25],['Baju hijau','🟢','#59c990',40],['Jaket kuning','🧥','#f2c84b',65],['Baju olahraga','🥋','#8d79db',80],['Kaos pelangi','🌈','#f28ca8',110],['Seragam sekolah','🎒','#385b9d',140],['Baju pahlawan','🦸','#e86d38',200]],pants:[['Celana biru','🔵','#5278bd',0],['Celana merah','🔴','#d95b69',25],['Celana hijau','🟢','#4fa978',40],['Celana pendek','🩳','#f0a84e',55],['Rok pink','👗','#e98ab8',70],['Celana olahraga','🏃','#766bc2',90]],ride:[['Skuter','🛴',0],['Sepeda','🚲',45],['Skateboard','🛹',70],['Mobil kecil','🚙',120],['Bus sekolah','🚌',160],['Kuda poni','🐴',180],['Roket','🚀',250],['Pesawat','✈️',300]],toy:[['Tanpa benda','',0],['Bola','⚽',20],['Boneka','🧸',35],['Layangan','🪁',45],['Balon','🎈',25],['Buku','📚',30],['Gitar','🎸',90],['Robot','🤖',100],['Kamera','📷',75]]};
let points=Number(localStorage.getItem('points')||0),old=JSON.parse(localStorage.getItem('dirikuProfile')||'{}'),profile={gender:old.gender||'girl',shirt:old.shirt??0,pants:old.pants??0,ride:old.ride??0,toy:old.toy??0,owned:old.owned||{shirt:[0],pants:[0],ride:[0],toy:[0]}},cat='shirt';const $=s=>document.querySelector(s);function save(){localStorage.setItem('points',points);localStorage.setItem('dirikuProfile',JSON.stringify(profile));$('#points').textContent=points}function render(){let list=data[cat],owned=profile.owned[cat]||[];$('#shop').innerHTML=list.map((x,i)=>{let has=owned.includes(i),active=profile[cat]===i,price=x[3]??x[2],can=has||points>=price;return `<div class="item ${has?'stored':''}"><div class="pic">${x[1]||'—'}</div><h3>${x[0]}</h3><div class="price">🪙 ${price}</div><button class="btn buy ${active?'owned':''}" data-i="${i}" ${can?'':'disabled'}>${active?'Lepas':has?'Pakai':'Beli'}</button></div>`}).join('');document.documentElement.style.setProperty('--shirt',profile.shirt==null?'transparent':data.shirt[profile.shirt][2]);document.documentElement.style.setProperty('--pants',profile.pants==null?'transparent':data.pants[profile.pants][2]);$('#shirtLayer').style.background=profile.shirt==null?'transparent':data.shirt[profile.shirt][2];$('#pantsLayer').style.background=profile.pants==null?'transparent':data.pants[profile.pants][2];$('#ride').textContent=profile.ride==null?'':data.ride[profile.ride][1];$('#toy').textContent=profile.toy==null?'':data.toy[profile.toy][1];$('#shirtTag').textContent=profile.shirt==null?'👕 Baju dilepas':data.shirt[profile.shirt][1]+' '+data.shirt[profile.shirt][0];$('#pantsTag').textContent=profile.pants==null?'👖 Celana dilepas':data.pants[profile.pants][1]+' '+data.pants[profile.pants][0];$('#toyTag').textContent=profile.toy==null?'':data.toy[profile.toy][1]+' '+data.toy[profile.toy][0];$('.person').classList.toggle('boy',profile.gender==='boy');$('.person').classList.toggle('girl',profile.gender==='girl');document.querySelectorAll('[data-gender]').forEach(b=>b.classList.toggle('active',b.dataset.gender===profile.gender));$('#points').textContent=points}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{profile.gender=b.dataset.gender;save();render()});$('#shop').onclick=e=>{let b=e.target.closest('[data-i]');if(!b)return;let i=+b.dataset.i,x=data[cat][i],price=x[3]??x[2],has=(profile.owned[cat]||[]).includes(i);if(!has){if(points<price)return;points-=price;profile.owned[cat].push(i)}profile[cat]=profile[cat]===i?null:i;save();render()};save();render();
</script><script src="enhance.js"></script></body></html>
