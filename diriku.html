<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diriku — Tilawah Quest</title>
<link rel="stylesheet" href="css/app.css?v=11">
<link rel="stylesheet" href="css/screens.css?v=11">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DDF1FA">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Amiri+Quran&display=swap" rel="stylesheet">
</head>
<body>
<main class="screen">
  <div class="appbar">
    <a class="iconbtn" href="belajar.html" aria-label="Kembali">←</a>
    <div class="titles"><b>Diriku</b><span>Belanja item pakai poin</span></div>
    <span class="chip"><span class="star">🪙</span> <b id="pts">0</b></span>
  </div>

  <section class="card stage-card">
    <div class="stage" id="stage"></div>
    <div class="tags" id="tags"></div>
    <div class="seg small" id="gender" role="group" aria-label="Pilih karakter">
      <button type="button" data-g="girl">👧 Perempuan</button>
      <button type="button" data-g="boy">👦 Laki-laki</button>
    </div>
  </section>

  <div class="seg tabs" id="tabs" role="tablist" aria-label="Kategori barang"></div>

  <section class="shop" id="shop" aria-live="polite"></section>
</main>

<script src="js/app.js?v=11"></script>
<script src="js/diriku.js?v=11"></script>
</body>
</html>
